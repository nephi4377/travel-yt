name: Deploy Busan Guide to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - '企劃/2026-09-釜山/地圖指南.html'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting-live.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  deploy_live_website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest guide to Firebase public index
        run: cp '企劃/2026-09-釜山/地圖指南.html' public/index.html

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BRAVE_CALLING_391208 }}'
          channelId: live
          projectId: brave-calling-391208
