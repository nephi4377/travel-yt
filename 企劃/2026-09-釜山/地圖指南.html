d9:{label:'9日 海雲台',title:'9/9（三）海雲台＋熟海鮮鍋',lead:'先坐海邊，再決定冬柏島或咖啡；廣安里只在五人都有體力、天氣舒服時才加。',pts:['haeundae','haemul','gwangalli'],stops:[['09:00','飯店→海雲台','1 號線到西面，轉 2 號線往長山；抓 50–60 分。','haeundae'],['10:00–12:00','海雲台沙灘','先坐 20 分再走，不排膠囊車。','haeundae'],['12:00–13:30','the Myeongpum Haemultang','點多人熟海鮮鍋再加飯／麵；不每人各點一份。','haemul'],['下午','冬柏島 or 咖啡｜二選一','不要兩個都排滿。有人累就短程叫車，不硬走。','haeundae'],['傍晚','廣安里｜可取消','有 2 人以上累、下雨／風大或晚餐座位不穩就取消。','gwangalli']],planB:'午餐排隊 >40 分或臨休：海雲台市場吃熟食，不回頭吃第二次豬肉湯飯。15:30–16:30 做一次體力／天氣判斷，條件不好就留海雲台。',contact:['海鮮鍋：051-704-9424｜近期資料 11:00–15:00、16:00–24:00，中間休息','近期資料標示可電話預約；五人預計 12:00–13:00 用餐，可抵達海雲台後先確認座位','位置：約海雲台海灘步行 3 分、海雲台站約 6 分'],identify:['正式韓文「더 명품 해물탕 조개구이 회 곰장어 중동점」','地址「부산 해운대구 해운대해변로265번길 10」','午餐後原則直接在附近 App 叫車，不額外走去固定計程車站'],taxi:[['熟海鮮鍋｜店名','더 명품 해물탕 조개구이 회 곰장어 중동점'],['熟海鮮鍋｜地址備援','부산 해운대구 해운대해변로265번길 10']],shoot:{hook:'昨天還在市場跟港口裡面走，今天搭快一個小時到海雲台，想看看同一座釜山會差多少。',must:['第一次看到海的建立鏡頭','五人坐下自然狀態','海鮮鍋未滾→煮滾→夾料→第一口'],maybe:['冬柏島步道','真的有去才拍廣安里傍晚'],skip:['為了行程完整硬衝廣安里']}},
d10:{label:'10日 太宗台',title:'9/10（四）太宗台→烤貝→Spa Land',lead:'全程最看天氣的一天；海邊走完直接叫車去 Centum，不回南浦折返。',pts:['taejongdae','yolo','spa'],stops:[['08:45','飯店→太宗台','五人兩台一般計程車，抓 25–35 分。','taejongdae'],['上午','太宗台','看外海，走到五人舒服為止。強風／大雨就取消。','taejongdae'],['12:00–13:30','感地海邊烤貝區','固定的是「附近吃全熟烤貝」；Yolo 是明確導航點。','yolo'],['13:30–14:00','餐廳附近直接叫車','不要走回太宗台入口；五人預設兩台一般車，大型車只有叫得到且不用久等才改。','yolo'],['14:15–15:00 起','Spa Land Centum City','依塞車彈性抵達；實際泡 2.5–4 小時，不必硬待滿。','spa'],['最晚約 20:00 前離開 Spa Land','新世界百貨內吃','餐廳街目前約 21:00 結束；不要泡到最後才找晚餐，泡完也不再跨區。','spa']],planB:'若沿海大雨／強風：太宗台與感地海邊縮短或取消，直接提前進 Centum 室內＋Spa Land。',contact:['Yolo：0507-1411-7237｜부산 영도구 감지길87번길 21','近期標示可預約、可團體；每月最後一個星期四公休，9/10 目前不衝突','Spa Land 官方：1668-2850｜08:00–23:00，22:00 最後入場｜成人 ₩26,000','一次入場基本 4 小時；超時及消費延長規則以當日官方為準','新世界官方目前餐廳街約營業至 21:00；五人想舒服吃晚餐，建議約 19:30–20:00 開始收尾離場'],identify:['感地海邊先認「감지해변 조개구이」區域，不死守單一店','Yolo 若五人好坐、可全熟就吃；若現場更順的熟食烤貝店也可直接用','烤貝後直接在餐廳附近叫車；巷道窄時依司機訊息一起移動，不分散','Spa Land 只拍外部與可拍區域；更衣、澡堂、禁拍區完全不拍'],taxi:[['烤貝導航｜Yolo','욜로 조개구이'],['烤貝地址備援','부산 영도구 감지길87번길 21'],['Centum 目的地','신세계백화점 센텀시티점'],['Centum 地址備援','부산 해운대구 센텀남대로 35']],shoot:{hook:'今天是這趟最看天氣的一天。太宗台如果風雨太大，我們就直接取消，因為後面的溫泉本來就是 Plan B。',must:['太宗台外海 Wide shot','五人走路狀態','烤貝火／煙／開殼／全熟','叫車離開感地海邊 3–5 秒轉場','Spa Land 外觀＋進場前／離場感想'],skip:['澡堂內禁止攝影區','為拍完整太宗台拖全家走每一站']}},
d11:{label:'11日 西面',title:'9/11（五）西面吃買收尾',lead:'最後完整一天不跑遠。晚餐不是三家逐家碰運氣：先確認 고짚，失敗才啟動第二順位。',pts:['seomyeon','redpig','pigtreelove','gojip'],stops:[['11:30','飯店→西面','1 號線往老圃方向；含走路抓 20–25 分。','seomyeon'],['中午～下午','地下街／百貨／採買','不追景點，買漏掉的東西。','seomyeon'],['15:00–16:30','先確認 고짚 五人座','能訂到合適時間就直接鎖定，不再比較三家。','gojip'],['第二順位｜只挑一間','紅豬 or 豬樹之愛','A 不行才依口味二選一；不要三家都跑現場。','seomyeon'],['21:00 前後','回飯店整理行李','確認隔天 08:45–09:00 叫車。','hotel']],planB:'第一順位訂不到，再從紅豬／豬樹選一間確認；第二間若仍需候位超過約 40 分鐘，直接在西面百貨／地下街就地吃，不追第三間。',contact:['고짚 서면본점：0507-1401-0815｜舊／直撥資料曾見 051-807-0815｜부전로 64 1층','고짚 近期公開資料：平日約 16:00–23:00，標示可預約、可團體','紅豬三昧境：0507-1353-0879｜동천로 121 1층｜近期約 16:00–24:00','豬樹之愛：0507-1336-5194｜중앙대로756번길 16 1층｜近期標示可預約，菜單仍見多種 갈매기살'],identify:['紅豬三昧境＝빨간돼지삼매경／동천로 121','豬樹之愛＝돼지나무 사랑걸렸네 서면본점／중앙대로756번길 16 1층；不要再用舊址 동천로 121','고짚＝고짚 서면본점／부전로 64 1층'],decision:['① 15:00–16:30 先確認 고짚 五人座／預約','② A 不行：想換口味選紅豬；想吃特色部位選豬樹','③ 第二間候位 >40 分：停止追店，就地吃'],taxi:[['고짚 第一順位','고짚 서면본점'],['豬樹之愛第二順位之一','돼지나무 사랑걸렸네 서면본점'],['紅豬第二順位之一','빨간돼지삼매경']],shoot:{hook:'最後一天留在西面，不再跑遠。晚餐先把五人座位處理好；第一順位如果能訂到就直接吃，不為拍片跑三家。',must:['西面街區人流','採買過程','15:00–16:30 確認五人座／預約結果','最後選定店的正確韓文招牌＋地址','菜單／代表菜／第一口','回房整理行李 5 秒'],skip:['把三家都走到門口做比較','為了選店戲劇性讓五人多走路'],thumb:['西面街景＋戰利品','最後一餐五人桌','正確店招＋人物半身']}},
d12:{label:'12日 回程',title:'9/12（六）只去機場',lead:'不排早市、不補景點。',pts:['hotel','airport'],stops:[['08:45–09:00','叫車去金海','兩台一般計程車或一台大型車。給司機：김해국제공항 국제선。','airport'],['約 09:30','抵達國際線','留託運與安檢時間。','airport'],['12:15','CI189 起飛','金海→桃園 13:40。','airport']],planB:'塞車就提早 15 分出門。',taxi:[['機場目的地','김해국제공항 국제선']],identify:['機場直接給司機看「김해국제공항 국제선」','不為補拍機場畫面延誤托運或安檢'],shoot:{hook:'今天沒有行程，就是從釜山站旁邊直接去機場。這趟最大的感覺不是去了多少地方，而是五個人沒有每天被行程追著跑。',must:['關門離開房間','行李上車','機場出發層／登機門','最後 5–10 秒空鏡']}}};
let current='d7',mode='travel';const tabs=document.getElementById('tabs'),content=document.getElementById('content');Object.keys(D).forEach(k=>{const b=document.createElement('button');b.textContent=D[k].label;b.onclick=()=>{current=k;render()};b.dataset.k=k;tabs.appendChild(b)});
function say(t){if(!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.84;speechSynthesis.speak(u)}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>{const x=document.createElement('div');x.textContent='已複製';x.style='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18181b;color:#fff;padding:9px 13px;border-radius:999px;z-index:99;font-weight:700';document.body.appendChild(x);setTimeout(()=>x.remove(),1000)}).catch(()=>prompt('複製以下文字：',t))}
function kakao(p){const q=encodeURIComponent((p[3]||'')+' '+(p[4]||''));return 'https://map.kakao.com/?q='+q}
const map=L.map('map',{zoomControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let layers=[];
function renderMap(keys){layers.forEach(x=>map.removeLayer(x));layers=[];const pts=[];keys.forEach(k=>{const p=P[k];if(!p)return;const m=L.marker([p[0],p[1]]).addTo(map).bindPopup('<b>'+p[2]+'</b><br>'+p[3]+'<br>'+p[4]);layers.push(m);pts.push([p[0],p[1]])});if(pts.length>1)map.fitBounds(pts,{padding:[25,25]});else if(pts.length===1)map.setView(pts[0],14)}
function stopHtml(s){const p=P[s[3]];const place=p?`<div class="place"><div class="kr">${p[3]}</div>${p[4]?`<div class="addr">${p[4]}</div>`:''}</div>`:'';return `<div class="stop"><div class="time">${s[0]}</div><div class="ttl">${s[1]}</div><div class="muted">${s[2]}</div>${place}${p?`<div class="actions"><button onclick="say('${p[3].replaceAll("'","\\'")}')">🔊 韓文</button><button onclick="copyText('${(p[3]+' '+p[4]).trim().replaceAll("'","\\'")}')">📋 複製</button><a target="_blank" rel="noopener" href="${kakao(p)}">🗺️ Kakao</a></div>`:''}</div>`}
function listCard(title,arr,cls='identify'){return arr&&arr.length?`<div class="card ${cls}"><h3>${title}</h3><ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
function taxiCard(arr){return arr&&arr.length?`<div class="card taxi"><h3>🚕 Kakao T／導航直接複製</h3>${arr.map(x=>`<p><b>${x[0]}</b><br><span class="code">${x[1]}</span><br><button class="copy" onclick="copyText('${x[1].replaceAll("'","\\'")}')">📋 複製</button></p>`).join('')}</div>`:''}
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.k===current));const d=D[current];renderMap(d.pts);if(mode==='travel'){content.innerHTML=`<div class="hero"><h2>${d.title}</h2><p>${d.lead}</p></div><div class="grid">${d.stops.map(stopHtml).join('')}</div>${taxiCard(d.taxi)}<div class="card"><h3>Plan B</h3><div class="warn">${d.planB}</div></div>${listCard('📞 現場聯絡／營業',d.contact,'contact')}${listCard('現場辨識',d.identify)}${listCard('今天怎麼選',d.decision,'decision')}<div class="card"><h3>五人現場韓文</h3><p><b>我們五位：</b>다섯 명이에요. <button onclick="say('다섯 명이에요')">🔊</button></p><p><b>不吃生魚片：</b>회는 안 먹어요. <button onclick="say('회는 안 먹어요')">🔊</button></p><p><b>海鮮全部熟：</b>해산물은 전부 익혀 주세요. <button onclick="say('해산물은 전부 익혀 주세요')">🔊</button></p><p><b>不要太辣：</b>너무 맵지 않게 해 주세요. <button onclick="say('너무 맵지 않게 해 주세요')">🔊</button></p><p><b>五個人一起坐？</b>다섯 명 같이 앉을 수 있어요? <button onclick="say('다섯 명 같이 앉을 수 있어요?')">🔊</button></p><p><b>今天五位可以預約嗎？</b>오늘 다섯 명 예약 가능해요? <button onclick="say('오늘 다섯 명 예약 가능해요?')">🔊</button></p><p><b>大約要等多久？</b>얼마나 기다려야 해요? <button onclick="say('얼마나 기다려야 해요?')">🔊</button></p><p><b>大型計程車：</b>대형택시 가능해요? <button onclick="say('대형택시 가능해요?')">🔊</button></p></div>`}else{const s=d.shoot||{};content.innerHTML=`<div class="hero shoot"><h2>🎬 ${d.title}</h2><p><b>Hook：</b>${s.hook||'以現場真實反應為主，不硬講稿。'}</p></div><div class="card shoot"><h3>一定要拍</h3>${(s.must||[]).map(x=>`<span class="tag must">${x}</span>`).join('')}</div>${s.maybe?`<div class="card shoot"><h3>有空再拍</h3>${s.maybe.map(x=>`<span class="tag maybe">${x}</span>`).join('')}</div>`:''}${s.skip?`<div class="card shoot"><h3>不用特地拍</h3>${s.skip.map(x=>`<span class="tag skip">${x}</span>`).join('')}</div>`:''}${s.thumb?`<div class="card shoot"><h3>Thumbnail 候選</h3><ul>${s.thumb.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}${listCard('現場辨識／字幕素材',d.identify)}${listCard('聯絡／時間字幕素材',d.contact,'contact')}${taxiCard(d.taxi)}<div class="card"><h3>拍攝規則</h3><p class="muted">先拍真實反應，再補資訊口白。未體驗前不預寫「很好吃／必去」。不要為了補鏡頭讓五人停下來重走、重排隊；禁拍區不拍。</p></div>`}}
document.getElementById('travelBtn').onclick=()=>{mode='travel';travelBtn.classList.add('active');shootBtn.classList.remove('active');render()};document.getElementById('shootBtn').onclick=()=>{mode='shoot';shootBtn.classList.add('active');travelBtn.classList.remove('active');render()};render();
</script>
