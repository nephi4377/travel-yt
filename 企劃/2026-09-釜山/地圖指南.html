d9:{label:'9日 海雲台',title:'9/9（三）海雲台＋熟海鮮鍋',lead:'先坐海邊，再決定冬柏島或咖啡；廣安里是可取消加菜。',pts:['haeundae','haemul','gwangalli'],stops:[['09:00','飯店→海雲台','1 號線到西面，轉 2 號線往長山；抓 50–60 分。','haeundae'],['10:00–12:00','海雲台沙灘','先坐 20 分再走，不排膠囊車。','haeundae'],['12:00–13:30','the Myeongpum Haemultang','點多人熟海鮮鍋再加飯／麵；不每人各點一份。','haemul'],['下午','冬柏島 or 咖啡｜二選一','不要兩個都排滿。','haeundae'],['傍晚','廣安里｜可取消','有人累、下雨或下午走很多就直接取消。','gwangalli']],planB:'午餐排隊 >40 分或臨休：海雲台市場吃熟食，不回頭吃第二次豬肉湯飯。下雨：海邊短走→室內咖啡／水族館→提早回。',contact:['海鮮鍋：051-704-9424／0507-1386-9424','近期平日營業：約 11:00–15:00、16:30–22:00；15:00–16:30 休息，午餐不要拖晚','近期平台標示可預約；五人若 9/8 晚仍確定，可先確認中午同桌，不必多天前綁死','位置：約海雲台海灘步行 3 分、海雲台站約 6 分'],identify:['正式韓文「더 명품 해물탕 조개구이 회 곰장어 중동점」','地址「해운대해변로265번길 10」雙重定位','必記鍋尺寸、五人點法、總價、是否加麵／炒飯'],shoot:{hook:'昨天還在市場跟港口裡面走，今天搭快一個小時到海雲台，想看看同一座釜山會差多少。',must:['第一次看到海的建立鏡頭','五人坐下自然狀態','海鮮鍋未滾→煮滾→夾料→第一口'],maybe:['冬柏島步道','真的有去才拍廣安里傍晚']}},
d10:{label:'10日 太宗台',title:'9/10（四）太宗台→烤貝→Spa Land',lead:'全程最看天氣的一天；海邊走完直接泡澡，不回南浦折返吃飯。',pts:['taejongdae','yolo','spa'],stops:[['08:45','飯店→太宗台','五人兩台一般計程車，抓 25–35 分。','taejongdae'],['上午','太宗台','看外海，走到五人舒服為止。強風／大雨就取消。','taejongdae'],['12:00–13:30','感地海邊烤貝區','固定的是「附近吃全熟烤貝」，不把單一店寫死。可導航 욜로 조개구이。','yolo'],['下午','Spa Land Centum City','目前資料：08:00–23:00、22:00 最後入場；成人 ₩26,000，9/5–9/6 再確認。','spa'],['晚上','新世界百貨內吃','泡完不再跨區。','spa']],planB:'若沿海天氣差：取消太宗台與海邊久坐，提早去 Centum 室內＋Spa Land。',contact:['Yolo 烤貝：0507-1411-7237｜地址 감지길87번길 21','近期標示可預約、可團體使用；五人可在太宗台離場前再電話確認','近期固定公休：每月最後一個星期四；9/10/2026 不是當月最後一個星期四，目前不衝突','貝類現場直接說「조개는 전부 완전히 익혀 주세요」＝全部烤熟'],identify:['感地海邊先認「감지해변 조개구이」區域，不死守單一店','Yolo 只是明確導航點，現場若有更順、五人好坐、可全熟的店就直接吃','Spa Land 只拍外部與可拍區域；更衣、澡堂、禁拍區完全不拍'],shoot:{hook:'今天是這趟最看天氣的一天。太宗台如果風雨太大，我們就直接取消，因為後面的溫泉本來就是 Plan B。',must:['太宗台外海 Wide shot','五人走路狀態','烤貝火／煙／開殼／全熟','Spa Land 外觀＋進場前／離場感想'],skip:['澡堂內禁止攝影區','為拍完整太宗台拖全家走每一站']}},
d11:{label:'11日 西面',title:'9/11（五）西面吃買收尾',lead:'最後完整一天不跑遠。三家不是同類備選：依「換口味／特色部位／五人省事」選一間。',pts:['seomyeon','redpig','pigtreelove','gojip'],stops:[['11:30','飯店→西面','1 號線往老圃方向；含走路抓 20–25 分。','seomyeon'],['中午～下午','地下街／百貨／採買','不追景點，買漏掉的東西。','seomyeon'],['晚餐 A｜換口味','紅豬三昧境','前幾天肉已吃多時優先；地址 동천로 121 1층。','redpig'],['晚餐 B｜特色部位','豬樹之愛 西面本店','想吃海鷗肉等有辨識度部位；地址 중앙대로756번길 16。','pigtreelove'],['晚餐 C｜五人省事','고짚 西面本店','座位、團體與預約優先；地址 부전로 64 1층。','gojip'],['21:00 前後','回飯店整理行李','確認隔天 08:45–09:00 叫車。','hotel']],planB:'只選一間；任一家候位超過約 40 分鐘就換下一家。若五人意見不合，直接百貨／地下街各吃各的。',identify:['紅豬三昧境＝빨간돼지삼매경／동천로 121','豬樹之愛＝돼지나무 사랑걸렸네 서면본점／중앙대로756번길 16；不要再用舊址 동천로 121','고짚＝고짚 서면본점／부전로 64 1층；近期資料支援預約與團體'],decision:['前幾天肉吃很多 → 紅豬三昧境','想吃／拍有辨識度部位 → 豬樹之愛','五人座位、預約、省事最重要 → 고짚','候位 >40 分 → 直接換下一家'],shoot:{hook:'最後一天我們反而留給西面，不再跑遠。晚餐也不先鎖死名店，下午看大家狀態再決定。',must:['西面街區人流','採買過程','最後選定店的正確韓文招牌＋地址','菜單／代表菜／第一口','回房整理行李 5 秒'],thumb:['西面街景＋戰利品','最後一餐五人桌','正確店招＋人物半身']}},
d12:{label:'12日 回程',title:'9/12（六）只去機場',lead:'不排早市、不補景點。',pts:['hotel','airport'],stops:[['08:45–09:00','叫車去金海','兩台一般計程車或一台大型車。給司機：김해국제공항 국제선。','airport'],['約 09:30','抵達國際線','留託運與安檢時間。','airport'],['12:15','CI189 起飛','金海→桃園 13:40。','airport']],planB:'塞車就提早 15 分出門。',identify:['機場直接給司機看「김해국제공항 국제선」','不為補拍機場畫面延誤托運或安檢'],shoot:{hook:'今天沒有行程，就是從釜山站旁邊直接去機場。這趟最大的感覺不是去了多少地方，而是五個人沒有每天被行程追著跑。',must:['關門離開房間','行李上車','機場出發層／登機門','最後 5–10 秒空鏡']}}};
let current='d7',mode='travel';const tabs=document.getElementById('tabs'),content=document.getElementById('content');Object.keys(D).forEach(k=>{const b=document.createElement('button');b.textContent=D[k].label;b.onclick=()=>{current=k;render()};b.dataset.k=k;tabs.appendChild(b)});function say(t){if(!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.84;speechSynthesis.speak(u)}function kakao(p){const q=encodeURIComponent((p[3]||'')+' '+(p[4]||''));return 'https://map.kakao.com/?q='+q}const map=L.map('map',{zoomControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let layers=[];function renderMap(keys){layers.forEach(x=>map.removeLayer(x));layers=[];const pts=[];keys.forEach(k=>{const p=P[k];if(!p)return;const m=L.marker([p[0],p[1]]).addTo(map).bindPopup('<b>'+p[2]+'</b><br>'+p[3]+'<br>'+p[4]);layers.push(m);pts.push([p[0],p[1]])});if(pts.length>1)map.fitBounds(pts,{padding:[25,25]});else if(pts.length===1)map.setView(pts[0],14)}function stopHtml(s){const p=P[s[3]];return `<div class="stop"><div class="time">${s[0]}</div><div class="ttl">${s[1]}</div><div class="muted">${s[2]}</div>${p?`<div class="actions"><button onclick="say('${p[3].replaceAll("'","\\'")}')">🔊 韓文</button><a target="_blank" rel="noopener" href="${kakao(p)}">🗺️ Kakao</a></div>`:''}</div>`}function listCard(title,arr,cls='identify'){return arr&&arr.length?`<div class="card ${cls}"><h3>${title}</h3><ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.k===current));const d=D[current];renderMap(d.pts);if(mode==='travel'){content.innerHTML=`<div class="hero"><h2>${d.title}</h2><p>${d.lead}</p></div><div class="grid">${d.stops.map(stopHtml).join('')}</div><div class="card"><h3>Plan B</h3><div class="warn">${d.planB}</div></div>${listCard('📞 現場聯絡／營業',d.contact,'contact')}${listCard('現場辨識',d.identify)}${listCard('今天怎麼選',d.decision,'decision')}<div class="card"><h3>五人現場韓文</h3><p><b>我們五位：</b>다섯 명이에요. <button onclick="say('다섯 명이에요')">🔊</button></p><p><b>不吃生魚片：</b>회는 안 먹어요. <button onclick="say('회는 안 먹어요')">🔊</button></p><p><b>海鮮全部熟：</b>해산물은 전부 익혀 주세요. <button onclick="say('해산물은 전부 익혀 주세요')">🔊</button></p><p><b>不要太辣：</b>너무 맵지 않게 해 주세요. <button onclick="say('너무 맵지 않게 해 주세요')">🔊</button></p><p><b>五個人一起坐？</b>다섯 명 같이 앉을 수 있어요? <button onclick="say('다섯 명 같이 앉을 수 있어요?')">🔊</button></p><p><b>可以預約嗎？</b>예약 가능해요? <button onclick="say('예약 가능해요?')">🔊</button></p></div>`}else{const s=d.shoot||{};content.innerHTML=`<div class="hero shoot"><h2>🎬 ${d.title}</h2><p><b>Hook：</b>${s.hook||'以現場真實反應為主，不硬講稿。'}</p></div><div class="card shoot"><h3>一定要拍</h3>${(s.must||[]).map(x=>`<span class="tag must">${x}</span>`).join('')}</div>${s.maybe?`<div class="card shoot"><h3>有空再拍</h3>${s.maybe.map(x=>`<span class="tag maybe">${x}</span>`).join('')}</div>`:''}${s.skip?`<div class="card shoot"><h3>不用特地拍</h3>${s.skip.map(x=>`<span class="tag skip">${x}</span>`).join('')}</div>`:''}${s.thumb?`<div class="card shoot"><h3>Thumbnail 候選</h3><ul>${s.thumb.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}${listCard('現場辨識／字幕素材',d.identify)}${listCard('聯絡／時間字幕素材',d.contact,'contact')}<div class="card"><h3>拍攝規則</h3><p class="muted">先拍真實反應，再補資訊口白。未體驗前不預寫「很好吃／必去」。不要為了補鏡頭讓五人停下來重走、重排隊；禁拍區不拍。</p></div>`}}document.getElementById('travelBtn').onclick=()=>{mode='travel';travelBtn.classList.add('active');shootBtn.classList.remove('active');render()};document.getElementById('shootBtn').onclick=()=>{mode='shoot';shootBtn.classList.add('active');travelBtn.classList.remove('active');render()};render();
</script>
