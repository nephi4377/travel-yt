let current='d7',mode='travel';const tabs=document.getElementById('tabs'),content=document.getElementById('content');Object.keys(D).forEach(k=>{const b=document.createElement('button');b.textContent=D[k].label;b.onclick=()=>{current=k;render()};b.dataset.k=k;tabs.appendChild(b)});function say(t){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.84;window.speechSynthesis.speak(u)}function copyText(t){navigator.clipboard?.writeText(t).then(()=>{const x=document.createElement('div');x.textContent='已複製';x.style='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#18181b;color:#fff;padding:9px 13px;border-radius:999px;z-index:99;font-weight:700';document.body.appendChild(x);setTimeout(()=>x.remove(),1000)}).catch(()=>prompt('複製以下文字：',t))}function kakao(p){const q=encodeURIComponent(((p[3]||'')+' '+(p[4]||'')).trim());return 'https://map.kakao.com/?q='+q}const map=L.map('map',{zoomControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let layers=[];function renderMap(keys){layers.forEach(x=>map.removeLayer(x));layers=[];const pts=[];keys.forEach(k=>{const p=P[k];if(!p||!Number.isFinite(p[0])||!Number.isFinite(p[1]))return;const m=L.marker([p[0],p[1]]).addTo(map).bindPopup('<b>'+p[2]+'</b><br>'+p[3]+'<br>'+p[4]);layers.push(m);pts.push([p[0],p[1]])});if(pts.length>1)map.fitBounds(pts,{padding:[25,25]});else if(pts.length===1)map.setView(pts[0],13);else map.setView([35.16,129.06],11)}function esc(s){return String(s||'').replaceAll('\\','\\\\').replaceAll("'","\\'")}function stopHtml(s){const p=P[s[3]];const place=p?`<div class="place"><div class="kr">${p[3]}</div>${p[4]?`<div class="addr">${p[4]}</div>`:''}</div>`:'';return `<div class="stop"><div class="time">${s[0]}</div><div class="ttl">${s[1]}</div><div class="muted">${s[2]}</div>${place}${p?`<div class="actions"><button onclick="say('${esc(p[3])}')">🔊 韓文</button><button onclick="copyText('${esc((p[3]+' '+p[4]).trim())}')">📋 複製</button><a target="_blank" rel="noopener" href="${kakao(p)}">🗺️ Kakao</a></div>`:''}</div>`}function listCard(title,arr,cls='identify'){return arr&&arr.length?`<div class="card ${cls}"><h3>${title}</h3><ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}function taxiCard(arr){return arr&&arr.length?`<div class="card taxi"><h3>🚕 Kakao T／導航直接複製</h3>${arr.map(x=>`<p><b>${x[0]}</b><br><span class="code">${x[1]}</span><br><button class="copy" onclick="copyText('${esc(x[1])}')">📋 複製</button></p>`).join('')}</div>`:''}function koreanCard(){return `<div class="card"><h3>五人現場韓文</h3><p><b>我們五位：</b> 다섯 명이에요. <button onclick="say('다섯 명이에요')">🔊</button></p><p><b>五個人一起坐？</b> 다섯 명 같이 앉을 수 있어요? <button onclick="say('다섯 명 같이 앉을 수 있어요?')">🔊</button></p><p><b>不吃生魚片：</b> 회는 안 먹어요. <button onclick="say('회는 안 먹어요')">🔊</button></p><p><b>海鮮全部熟：</b> 해산물은 전부 익혀 주세요. <button onclick="say('해산물은 전부 익혀 주세요')">🔊</button></p><p><b>不要太辣：</b> 너무 맵지 않게 해 주세요. <button onclick="say('너무 맵지 않게 해 주세요')">🔊</button></p><p><b>要等多久？</b> 얼마나 기다려야 해요? <button onclick="say('얼마나 기다려야 해요?')">🔊</button></p><p><b>有大型計程車？</b> 대형택시 있어요? <button onclick="say('대형택시 있어요?')">🔊</button></p><p><b>可以寄放購物袋？</b> 이 쇼핑백들을 맡길 수 있어요? <button onclick="say('이 쇼핑백들을 맡길 수 있어요?')">🔊</button></p></div>`}function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.k===current));const d=D[current];renderMap(d.pts);if(mode==='travel'){content.innerHTML=`<div class="hero"><h2>${d.title}</h2><p>${d.lead}</p></div><div class="grid">${d.stops.map(stopHtml).join('')}</div>${taxiCard(d.taxi)}<div class="card"><h3>Plan B</h3><div class="warn">${d.planB}</div></div>${listCard('📞 現場聯絡／營業',d.contact,'contact')}${listCard('現場辨識',d.identify)}${listCard('今天怎麼選',d.decision,'decision')}${koreanCard()}`}else{const s=d.shoot||{};content.innerHTML=`<div class="hero shoot"><h2>🎬 ${d.title}</h2><p><b>Hook：</b>${s.hook||'以現場真實反應為主。'}</p></div><div class="card shoot"><h3>一定要拍</h3>${(s.must||[]).map(x=>`<span class="tag must">${x}</span>`).join('')}</div>${s.maybe?`<div class="card shoot"><h3>有空再拍</h3>${s.maybe.map(x=>`<span class="tag maybe">${x}</span>`).join('')}</div>`:''}${s.skip?`<div class="card shoot"><h3>不用特地拍</h3>${s.skip.map(x=>`<span class="tag skip">${x}</span>`).join('')}</div>`:''}${s.thumb?`<div class="card shoot"><h3>Thumbnail 候選</h3><ul>${s.thumb.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}${listCard('現場辨識／字幕素材',d.identify)}${listCard('聯絡／時間字幕素材',d.contact,'contact')}${taxiCard(d.taxi)}<div class="card"><h3>拍攝規則</h3><p class="muted">先拍真實反應，再補資訊口白。未體驗前不預寫「很好吃／必去／超好買」。不要為補鏡頭讓五人停下來重走、重排隊；禁拍區不拍。</p></div>`}}travelBtn.onclick=()=>{mode='travel';travelBtn.classList.add('active');shootBtn.classList.remove('active');render()};shootBtn.onclick=()=>{mode='shoot';shootBtn.classList.add('active');travelBtn.classList.remove('active');render()};render();
</script>
