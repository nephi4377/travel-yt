const D={
d7:{label:'7日 抵達',title:'9/7｜只進房、吃飯、睡覺',lead:'第一晚不追景點。別味清有吃就是唯一一次豬肉湯飯；太晚直接便利商店。',pts:['airport','hotel'],stops:[['19:00前後','金海落地','出關領行李後，大型車能迅速確認就一台，否則 3＋2 兩台一般車。','airport'],['抵達後','Booking the Bay','先放行李、休息；晚餐服從體力。','hotel']],planB:'航班一般延誤只縮晚餐；極端晚到直接便利商店，不追店、不補景點。',shoot:{story:'五個人晚上才到釜山，第一天只做最現實的事。',must:['金海抵達牌','五人＋行李','房門第一次打開','第一晚吃到什麼'],maybe:['車窗進市區'],line:'「今天完全不排景點，先把行李放好、吃到東西，明天才正式開始。」'}},
d8:{label:'8日 港區',title:'9/8｜南浦・市場・札嘎其',lead:'市場與陸上主線照走；港邊是否停留只看 KMA 當下海象與五人體感。',pts:['nampo','jagalchi','gogibon'],stops:[['09:30','飯店→南浦','釜山站搭 1 號線；今天一路慢走，不跨區。','nampo'],['11:30–13:00','密麵午餐','候位超過 40 分就同區換熟食。',null],['下午','國際市場／富平／札嘎其','市場是主體；不把生魚片當餐食目的。','jagalchi'],['17:00後','高基本','先確認五人同桌；先 4 人套餐再追加。','gogibon']],planB:'KMA 9/7 16:00 KST 現行特報仍列釜山前海風浪注意報，解除預告 9/8 09:00–12:00。若警示仍在、浪明顯或有人不舒服：港面 Wide、碼頭、橋邊、影島大橋全部刪；市場照走。',shoot:{story:'從市場一路走到港邊，看舊市區的生活感。',must:['南浦／市場入口建立鏡頭','人流 Wide','冰、水、秤、推車細節','實際午晚餐招牌／價格／第一口','離場一句'],maybe:['港面 Wide','影島大橋；海象不好就零成本刪除'],line:'「今天不一直跳景點，就從市場慢慢走；排隊超過四十分鐘我們就換。」'}},
d9:{label:'9日 海雲台',title:'9/9｜海雲台＋熟海鮮＋Club D Oasis',lead:'Club D Oasis 是下午唯一核心；廣安里退出。',pts:['haeundae','haemul','clubd'],stops:[['10:00左右','海雲台','先坐、先看海，不一到就趕景點。','haeundae'],['12:00–13:30','全熟海鮮鍋','完整韓文店名導航；臨休／>40 分就在海雲台同區換熟食。','haemul'],['14:00後','Club D Oasis','官方樓層：4F Water Park、5F Cheongsudang／Ocean View Spa、6F Theme Spa／Outdoor Terrace。五人裝備全齊才 Water Park；任一不齊直接 Spa。','clubd']],planB:'Club D 臨時失效才恢復冬柏島或咖啡二選一；不補廣安里。Water Park 需要泳裝＋完整遮髮帽類＋aqua shoes，Crocs／一般拖鞋／涼鞋／球鞋不算。',contact:['Club D：1566-8007','成人價格錨點：Combo 約 ₩54,000；Spa 約 ₩33,000，當日結帳頁為準'],shoot:{story:'從海雲台的「開」進到一家人真正想玩的 Club D Oasis。',must:['海灘第一個 Wide','海鮮鍋煮滾＋第一口','LCT 外觀','Club D 正式入口／票價方案','進場前與離場後反應'],maybe:['可合法拍攝的海景公共空間'],line:'「下午我們不再塞景點，直接把時間留給 Club D Oasis；到底玩水還是只做 Spa，就看五個人的裝備。」'}},
d10:{label:'10日 指定日',title:'9/10｜Outlet → MUSEUM 1 → 馬鈴薯排骨湯',lead:'太太的媒體藝術＋女兒的感자탕正式入主線；虛心廳退出。',pts:['outlet','museum','gamja'],stops:[['10:30–14:00/14:30','Busan Premium Outlets','五人分開逛、固定集合；館內吃午餐。','outlet'],['15:30–17:00','MUSEUM 1','抓 75–100 分鐘；當日再確認售票／最後入場。','museum'],['17:30後','西面馬鈴薯排骨湯','先問大份一鍋是否足夠五人，再追加。','gamja']],planB:'若太太其實指定 ARTE MUSEUM，只做單館替換，不兩館都去。Outlet 過度延長就縮短 MUSEUM 停留，不把晚餐拖成追店；感자탕 >40 分只在西面同區換。',contact:['MUSEUM 1：051-731-3302','감자탕：0507-1327-1100'],shoot:{story:'今天不是加景點，而是把家人真的想做的事排進去。',must:['Outlet 主入口＋折扣牌＋戰利品','MUSEUM 1 外觀／館名＋1–2個合法代表 Wide＋人物反應','感자탕 招牌／菜單價格／鍋滾／第一口'],maybe:['交通轉場','戰利品在車內'],line:'「今天三件事都很生活：逛 Outlet、看媒體藝術、最後去吃女兒指定的馬鈴薯排骨湯。」'}},
d11:{label:'11日 西面',title:'9/11｜西面慢走＋最後晚餐',lead:'晚餐高짚第一順位；午餐避免再排重口味豬肉湯鍋。',pts:['seomyeon','gojip'],stops:[['11:30後','西面慢走','地下街／百貨／商圈，留體力整理行李。','seomyeon'],['晚餐','고짚 서면본점','先確認五人座位；失敗才啟動單一備案。','gojip']],planB:'第一家不能安排五人就換一次；第二家仍 >40 分即停止追店。',shoot:{story:'最後一個完整日，不補課，只留下真的喜歡的西面。',must:['街區 Wide','自然採買','最後餐廳招牌／價格／第一口','離店總結'],maybe:['回房整理行李'],line:'「最後一天不想再跑遠，西面慢慢走，把時間留給一家人。」'}},
d12:{label:'12日 回程',title:'9/12｜只去機場',lead:'08:45–09:00 叫車，約 09:30 抵達金海。',pts:['hotel','airport'],stops:[['08:45–09:00','Booking the Bay 出發','大型車不能迅速確認就 3＋2 兩台一般車。','hotel'],['約09:30','金海國際機場','CI189 表定 12:15；當日只認華航官方班況。','airport']],planB:'不安排最後一個景點、不為早餐名店增加誤機風險。',shoot:{story:'把旅程收好，不把回程拍成機場導覽。',must:['行李關門','出發／機場牌','片尾一句'],maybe:['車窗'],line:'「這趟最後沒有補任何景點，五個人舒服走完比把清單勾滿重要。」'}}};
const FOOD={d7:[['首選｜別味清豬肉湯飯','有體力、時間還早才吃；若今晚吃了，整趟豬肉湯飯額度即使用完。'],['備案｜飯店周邊便利商店','晚到或太累直接買熟食／飯糰／蛋／飲料，不追店。']],d8:[['午餐｜南浦同區密麵','候位超過 40 分就換同區熟食，不跨區追名店。'],['晚餐首選｜고기본 高基本','五人先問能否同桌；可先點 4 人套餐再視食量追加。'],['備案｜南浦／札嘎其同區熟食','避開生魚片；海鮮要求全熟。']],d9:[['午餐首選｜더 명품 해물탕 조개구이 회 곰장어 중동점','以全熟海鮮鍋為主，直接說 해산물은 완전히 익혀 주세요.'],['備案｜海雲台同區熟食','臨休或候位超過 40 分就在海雲台換，不為餐廳離開主線。']],d10:[['午餐｜Busan Premium Outlets 館內','以逛街節奏為優先，館內直接解決午餐，避免多一次交通。'],['晚餐首選｜누리마을감자탕 서면점','女兒指定馬鈴薯排骨湯；五人先問大份一鍋是否足夠，再追加。'],['備案｜西面同區 감자탕','首選失效只在西面換店。']],d11:[['晚餐首選｜고짚 서면본점','先確認五人座位；保留胃口給最後一晚。'],['午餐／備案｜西面商圈清爽熟食','避免再排重口味豬肉湯鍋；候位超過 40 分同區換。']],d12:[['早餐／早午餐｜飯店周邊或機場','返程日不追店；以不影響 08:45–09:00 出發為原則。'],['備案｜金海機場內熟食','依時間決定，先確保登機。']]};
let day='d8',mode='travel',map=null,marks=[];const tabs=document.getElementById('tabs'),travelBtn=document.getElementById('travelBtn'),shootBtn=document.getElementById('shootBtn'),content=document.getElementById('content'),mapEl=document.getElementById('map');if(window.L){try{map=L.map('map').setView([35.16,129.09],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}catch(e){map=null;if(mapEl)mapEl.style.display='none'}}else{if(mapEl)mapEl.style.display='none'}

function copy(t){navigator.clipboard&&navigator.clipboard.writeText(t)}
function place(k){if(!k||!P[k])return'';let p=P[k],q=[p[3],p[4]].filter(Boolean).join(' ');return `<div class="addr"><span class="kr">${esc(p[3])}</span><br>${esc(p[4])}<div class="actions"><button onclick="copy('${q.replace(/'/g,"\\'")}')">複製韓文＋地址</button></div></div>`}
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.d===day));travelBtn.classList.toggle('active',mode==='travel');shootBtn.classList.toggle('active',mode==='shoot');let d=D[day],h=`<div class="hero"><h2>${d.title}</h2><p>${d.lead}</p></div>`;if(mode==='travel'){h+=d.stops.map((s,i)=>`<details class="subitem" ${i===0?'open':''}><summary><span class="sumtime">${s[0]}</span>${s[1]}</summary><div class="subbody"><p>${s[2]}</p>${place(s[3])}</div></details>`).join('')+`<details class="subitem"><summary>🍽 吃飯推薦</summary><div class="subbody">${(FOOD[day]||[]).map(x=>`<div class="foodrow"><b>${x[0]}</b><div class="small">${x[1]}</div></div>`).join('')}</div></details>`+`<details class="subitem"><summary>Plan B／現場決策</summary><div class="subbody"><p>${d.planB}</p></div></details>`+(d.contact?`<details class="subitem"><summary>電話／提醒</summary><div class="subbody"><ul>${d.contact.map(x=>`<li>${x}</li>`).join('')}</ul></div></details>`:'')+`<details class="subitem"><summary>韓文求生</summary><div class="subbody"><p class="small">五位同桌：<b>다섯 명인데 같이 앉을 수 있어요?</b><br>可以候位嗎：<b>웨이팅 가능해요? 얼마나 기다려요?</b><br>不吃生魚片：<b>저희는 회를 안 먹어요.</b><br>海鮮全熟：<b>해산물은 완전히 익혀 주세요.</b><br>少辣：<b>덜 맵게 해 주세요.</b><br>大型計程車：<b>다섯 명인데 대형택시 호출 가능해요?</b></p></div></details>`}else{let s=d.shoot;h+=`<div class="card"><h3>故事線</h3><p>${s.story}</p><div class="warn"><b>自然口白</b><br>${s.line}</div></div><div class="card"><h3>一定要拍</h3>${s.must.map(x=>`<span class="tag must">${x}</span>`).join('')}</div><div class="card"><h3>有空再拍</h3>${s.maybe.map(x=>`<span class="tag maybe">${x}</span>`).join('')}</div><div class="card"><h3>防漏原則</h3><p>抵達／外觀 → Wide → 招牌／價格 → 核心體驗 → 第一反應 → 離場一句。家人不等鏡頭；更衣室、浴場、禁拍區不拍。</p></div>`}content.innerHTML=h;if(map){marks.forEach(m=>map.removeLayer(m));marks=[];let ll=[];(d.pts||[]).forEach(k=>{let p=P[k];if(p&&p[0]!=null){let m=L.marker([p[0],p[1]]).addTo(map).bindPopup(`<b>${esc(p[2])}</b><br>${esc(p[3])}<br>${esc(p[4])}`);marks.push(m);ll.push([p[0],p[1]])}});if(ll.length>1)map.fitBounds(ll,{padding:[25,25]});else if(ll.length)map.setView(ll[0],14)}}
Object.entries(D).forEach(([k,v])=>{let b=document.createElement('button');b.textContent=v.label;b.dataset.d=k;b.onclick=()=>{day=k;render()};tabs.appendChild(b)});travelBtn.onclick=()=>{mode='travel';render()};shootBtn.onclick=()=>{mode='shoot';render()};render();
