<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>釜山 2026｜五人現場指南</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--blue:#1d4ed8;--orange:#c2410c;--green:#166534;--purple:#6d28d9;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}header{position:sticky;top:0;z-index:20;background:rgba(246,247,248,.96);backdrop-filter:blur(12px);padding:14px 14px 10px;border-bottom:1px solid var(--line)}h1{font-size:1.2rem;margin:0 0 4px}.sub{font-size:.9rem;color:var(--muted);line-height:1.5;margin:0}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 14px 4px}.tabs button,.mode button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;white-space:nowrap;font-weight:700}.tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.mode{display:flex;gap:8px;padding:8px 14px}.mode button.active{background:var(--purple);color:#fff;border-color:var(--purple)}main{padding:0 14px 28px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.hero h2,.card h3{margin:0 0 7px}.hero p,.card p,.card li{line-height:1.6}.muted{color:var(--muted)}.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px}.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:12px;padding:10px 12px}.grid{display:grid;grid-template-columns:1fr;gap:8px}.stop{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.time{font-weight:800;color:var(--blue);font-size:.9rem}.ttl{font-weight:800;margin:3px 0}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.actions a,.actions button{border:1px solid #bfdbfe;background:#eff6ff;color:var(--blue);border-radius:10px;padding:9px 10px;text-decoration:none;font-weight:700}.actions button{cursor:pointer}.tag{display:inline-block;font-size:.78rem;border-radius:999px;padding:4px 8px;margin:2px 4px 2px 0;background:#f4f4f5;color:#3f3f46}.tag.must{background:#fef2f2;color:var(--red)}.tag.maybe{background:#fffbeb;color:#92400e}.tag.skip{background:#f4f4f5;color:#71717a}.shoot{border-left:4px solid var(--purple)}.identify{border-left:4px solid var(--green)}.decision{border-left:4px solid var(--orange)}#map{height:250px;border-radius:16px;border:1px solid var(--line);margin:10px 0;background:#e4e4e7}.small{font-size:.84rem}.footer{color:var(--muted);font-size:.82rem;line-height:1.5;padding:10px 2px}@media(min-width:760px){main{max-width:760px;margin:auto}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>釜山 2026｜五人現場指南</h1><p class="sub">9/7–9/12｜Booking the Bay（釜山站）｜一天一區、排隊超過約 40 分就換、海鮮全部熟食。</p></header>
<div class="tabs" id="tabs"></div><div class="mode"><button id="travelBtn" class="active">🧭 現場模式</button><button id="shootBtn">🎬 拍攝模式</button></div>
<main><div id="map"></div><section id="content"></section><div class="footer">店家營業、公休、價格與地址可能變動。9/5 起以 Naver Map / Kakao Map 做最後確認；資料衝突時以當日官方／店家地圖頁為準。未確認授權的外部圖片不存入 repo，現場辨識優先看韓文正式名＋地址。</div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const P={hotel:[35.116044,129.045595,'Booking the Bay','부킹더베이','부산 동구 충장대로 160'],airport:[35.1795,128.9382,'金海國際機場','김해국제공항',''],nampo:[35.0979,129.0304,'南浦','남포',''],bupyeong:[35.1006,129.0263,'富平罐頭市場','부평깡통시장','부산 중구 부평1길 48'],jagalchi:[35.0966,129.0307,'札嘎其','자갈치시장',''],milmyeon:[35.0993,129.0297,'奶奶伽倻密麵','할매가야밀면','부산 중구 광복로 56-14'],gogibon:[35.0982,129.0318,'高基本','고기본','부산 중구 중구로5번길 5 1층'],haeundae:[35.1587,129.1604,'海雲台','해운대해수욕장',''],haemul:[35.1603,129.1617,'the Myeongpum Haemultang','더명품해물탕','부산 해운대구 해운대해변로265번길 10'],gwangalli:[35.1532,129.1185,'廣安里','광안리',''],taejongdae:[35.0528,129.0875,'太宗台','태종대',''],yolo:[35.057,129.083,'感地海邊 Yolo 烤貝','욜로 조개구이','부산 영도구 감지길87번길 21'],spa:[35.1688,129.1308,'Spa Land Centum City','신세계 스파랜드','부산 해운대구 센텀남대로 35'],seomyeon:[35.1578,129.0592,'西面','서면',''],redpig:[35.1579,129.0646,'紅豬三昧境','빨간돼지삼매경','부산 부산진구 동천로 121 1층'],pigtreelove:[35.1597,129.0619,'豬樹之愛 西面本店','돼지나무 사랑걸렸네 서면본점','부산 부산진구 중앙대로756번길 16'],gojip:[35.1559,129.0575,'고짚 西面本店','고짚 서면본점','부산 부산진구 부전로 64 1층']};
const D={
d7:{label:'7日 抵達',title:'9/7（一）只進房、吃飯、睡覺',lead:'第一晚不追景點。若吃到別味清，這就是整趟唯一一次豬肉湯飯。',pts:['airport','hotel'],stops:[['19:00','金海落地','出關、領行李後叫兩台一般計程車或一台大型車。','airport'],['20:30–21:30','入住 Booking the Bay','先進房。走得動再吃別味清豬肉湯飯；太累直接便利商店。','hotel']],planB:'晚到、下雨、累都不影響：第一晚成功標準只有進房與吃到東西。',identify:['飯店以「부킹더베이」＋「충장대로 160」雙重確認','第一餐若吃別味清，記錄實付價格與排隊時間'],shoot:{hook:'晚上才到釜山，所以今天完全不排景點，先把最現實的事情做好：進房、吃飯、睡覺。',must:['金海抵達牌','五人行李／叫車','房門第一次打開','第一餐或便利商店戰利品'],maybe:['車窗進市區','飯店港邊夜景']}},
d8:{label:'8日 港區',title:'9/8（二）南浦→市場→札嘎其',lead:'主拍攝日。札嘎其不把生魚片當主餐，市場動線一路步行、不跳區。',pts:['nampo','bupyeong','jagalchi','milmyeon','gogibon'],stops:[['09:30','飯店→南浦','釜山站 1 號線往多大方向 2–3 站。','nampo'],['11:30–13:00','奶奶伽倻密麵','水密麵／拌密麵＋王餃。排隊 >40 分就換。','milmyeon'],['下午','國際市場→富平罐頭市場→札嘎其','一路步行；影島大橋只在五人都有體力時加。','bupyeong'],['18:00–19:30','南浦晚餐｜高基本','五人能訂就先訂；訂不到改南浦熟食。','gogibon']],planB:'下雨：市場有頂走道照走，影島大橋取消。',identify:['富平罐頭市場看「부평깡통시장」，不要誤認「부전시장」','密麵店認「할매가야밀면」＋ 광복로 56-14','市場拍入口招牌與通道，不追著陌生人臉拍'],shoot:{hook:'大家第一次來釜山很容易把景點塞滿，但我們今天只走南浦到札嘎其這一小塊，看看慢慢走會不會更像真的在旅行。',must:['南浦出站 Wide shot','市場入口與人流','秤／冰／水／推車細節','午餐招牌＋價格＋上桌＋第一口','札嘎其外圍工作場景＋港面','離場 10 秒總結'],maybe:['影島大橋風聲','港口吊車與船'],thumb:['市場冰塊／海鮮前人物半身','港邊＋人物＋札嘎其背景','五人餐桌俯拍']}},
d9:{label:'9日 海雲台',title:'9/9（三）海雲台＋熟海鮮鍋',lead:'先坐海邊，再決定冬柏島或咖啡；廣安里是可取消加菜。',pts:['haeundae','haemul','gwangalli'],stops:[['09:00','飯店→海雲台','1 號線到西面，轉 2 號線往長山；抓 50–60 分。','haeundae'],['10:00–12:00','海雲台沙灘','先坐 20 分再走，不排膠囊車。','haeundae'],['12:00–13:30','the Myeongpum Haemultang','全熟海鮮鍋；五人實際點法與總價留現場記錄。','haemul'],['下午','冬柏島 or 咖啡｜二選一','不要兩個都排滿。','haeundae'],['傍晚','廣安里｜可取消','有人累、下雨或下午走很多就直接取消。','gwangalli']],planB:'午餐店休：海雲台市場吃熟食。下雨：海邊短走→室內咖啡／水族館→提早回。',identify:['海鮮鍋店用英文店名＋「해운대해변로265번길 10」雙重定位','必記鍋尺寸、五人點法、總價、是否加麵／炒飯'],shoot:{hook:'昨天還在市場跟港口裡面走，今天搭快一個小時到海雲台，想看看同一座釜山會差多少。',must:['第一次看到海的建立鏡頭','五人坐下自然狀態','海鮮鍋上桌→煮滾→夾料→第一口'],maybe:['冬柏島步道','真的有去才拍廣安里傍晚']}},
d10:{label:'10日 太宗台',title:'9/10（四）太宗台→烤貝→Spa Land',lead:'全程最看天氣的一天；海邊走完直接泡澡，不回南浦折返吃飯。',pts:['taejongdae','yolo','spa'],stops:[['08:45','飯店→太宗台','五人兩台一般計程車，抓 25–35 分。','taejongdae'],['上午','太宗台','看外海，走到五人舒服為止。強風／大雨就取消。','taejongdae'],['12:00–13:30','感地海邊烤貝區','先選五人坐得下的店；可導航 욜로 조개구이。所有貝類都烤熟。','yolo'],['下午','Spa Land Centum City','08:00–23:00、22:00 最後入場；成人 ₩26,000，出發前再查一次。','spa'],['晚上','新世界百貨內吃','泡完不再跨區。','spa']],planB:'若沿海天氣差：直接取消太宗台，提早去 Centum 室內＋Spa Land。',identify:['感地海邊先認「감지해변 조개구이」區域，不死守單一店','Spa Land 只拍外部與可拍區域；更衣、澡堂、禁拍區完全不拍'],shoot:{hook:'今天是這趟最看天氣的一天。太宗台如果風雨太大，我們就直接取消，因為後面的溫泉本來就是 Plan B。',must:['太宗台外海 Wide shot','五人走路狀態','烤貝火／煙／開殼','Spa Land 外觀＋進場前／離場感想'],skip:['澡堂內禁止攝影區','為拍完整太宗台拖全家走每一站']}},
d11:{label:'11日 西面',title:'9/11（五）西面吃買收尾',lead:'最後完整一天不跑遠。三家不是同類備選：依「換口味／特色部位／五人省事」選一間。',pts:['seomyeon','redpig','pigtreelove','gojip'],stops:[['11:30','飯店→西面','1 號線往老圃方向；含走路抓 20–25 分。','seomyeon'],['中午～下午','地下街／百貨／採買','不追景點，買漏掉的東西。','seomyeon'],['晚餐 A｜換口味','紅豬三昧境','前幾天肉已吃多時優先；地址 동천로 121 1층。','redpig'],['晚餐 B｜特色部位','豬樹之愛 西面本店','想吃海鷗肉等有辨識度部位；地址 중앙대로756번길 16。','pigtreelove'],['晚餐 C｜五人省事','고짚 西面本店','座位、團體與預約優先；地址 부전로 64 1층。','gojip'],['21:00 前後','回飯店整理行李','確認隔天 08:45–09:00 叫車。','hotel']],planB:'只選一間；任一家候位超過約 40 分鐘就換下一家。若五人意見不合，直接百貨／地下街各吃各的。',identify:['紅豬三昧境＝빨간돼지삼매경／동천로 121','豬樹之愛＝돼지나무 사랑걸렸네 서면본점／중앙대로756번길 16；不要再用舊址 동천로 121','고짚＝고짚 서면본점／부전로 64 1층；近期資料支援預約與團體'],decision:['前幾天肉吃很多 → 紅豬三昧境','想吃／拍有辨識度部位 → 豬樹之愛','五人座位、預約、省事最重要 → 고짚','候位 >40 分 → 直接換下一家'],shoot:{hook:'最後一天我們反而留給西面，不再跑遠。晚餐也不先鎖死名店，下午看大家狀態再決定。',must:['西面街區人流','採買過程','最後選定店的正確韓文招牌＋地址','菜單／代表菜／第一口','回房整理行李 5 秒'],thumb:['西面街景＋戰利品','最後一餐五人桌','正確店招＋人物半身']}},
d12:{label:'12日 回程',title:'9/12（六）只去機場',lead:'不排早市、不補景點。',pts:['hotel','airport'],stops:[['08:45–09:00','叫車去金海','兩台一般計程車或一台大型車。給司機：김해국제공항 국제선。','airport'],['約 09:30','抵達國際線','留託運與安檢時間。','airport'],['12:15','CI189 起飛','金海→桃園 13:40。','airport']],planB:'塞車就提早 15 分出門。',identify:['機場直接給司機看「김해국제공항 국제선」','不為補拍機場畫面延誤托運或安檢'],shoot:{hook:'今天沒有行程，就是從釜山站旁邊直接去機場。這趟最大的感覺不是去了多少地方，而是五個人沒有每天被行程追著跑。',must:['關門離開房間','行李上車','機場出發層／登機門','最後 5–10 秒空鏡']}}};
let current='d7',mode='travel';const tabs=document.getElementById('tabs'),content=document.getElementById('content');Object.keys(D).forEach(k=>{const b=document.createElement('button');b.textContent=D[k].label;b.onclick=()=>{current=k;render()};b.dataset.k=k;tabs.appendChild(b)});function say(t){if(!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.84;speechSynthesis.speak(u)}function kakao(p){const q=encodeURIComponent((p[3]||'')+' '+(p[4]||''));return 'https://map.kakao.com/?q='+q}const map=L.map('map',{zoomControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let layers=[];function renderMap(keys){layers.forEach(x=>map.removeLayer(x));layers=[];const pts=[];keys.forEach(k=>{const p=P[k];if(!p)return;const m=L.marker([p[0],p[1]]).addTo(map).bindPopup('<b>'+p[2]+'</b><br>'+p[3]+'<br>'+p[4]);layers.push(m);pts.push([p[0],p[1]])});if(pts.length>1)map.fitBounds(pts,{padding:[25,25]});else if(pts.length===1)map.setView(pts[0],14)}function stopHtml(s){const p=P[s[3]];return `<div class="stop"><div class="time">${s[0]}</div><div class="ttl">${s[1]}</div><div class="muted">${s[2]}</div>${p?`<div class="actions"><button onclick="say('${p[3].replaceAll("'","\\'")}')">🔊 韓文</button><a target="_blank" rel="noopener" href="${kakao(p)}">🗺️ Kakao</a></div>`:''}</div>`}function listCard(title,arr,cls='identify'){return arr&&arr.length?`<div class="card ${cls}"><h3>${title}</h3><ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.k===current));const d=D[current];renderMap(d.pts);if(mode==='travel'){content.innerHTML=`<div class="hero"><h2>${d.title}</h2><p>${d.lead}</p></div><div class="grid">${d.stops.map(stopHtml).join('')}</div><div class="card"><h3>Plan B</h3><div class="warn">${d.planB}</div></div>${listCard('現場辨識',d.identify)}${listCard('今天怎麼選',d.decision,'decision')}<div class="card"><h3>五人現場韓文</h3><p><b>我們五位：</b>다섯 명이에요. <button onclick="say('다섯 명이에요')">🔊</button></p><p><b>不吃生魚片：</b>회는 안 먹어요. <button onclick="say('회는 안 먹어요')">🔊</button></p><p><b>海鮮全部熟：</b>해산물은 전부 익혀 주세요. <button onclick="say('해산물은 전부 익혀 주세요')">🔊</button></p><p><b>不要太辣：</b>너무 맵지 않게 해 주세요. <button onclick="say('너무 맵지 않게 해 주세요')">🔊</button></p><p><b>可以五個人一起坐嗎？</b>다섯 명 같이 앉을 수 있어요? <button onclick="say('다섯 명 같이 앉을 수 있어요?')">🔊</button></p></div>`}else{const s=d.shoot||{};content.innerHTML=`<div class="hero shoot"><h2>🎬 ${d.title}</h2><p><b>Hook：</b>${s.hook||'以現場真實反應為主，不硬講稿。'}</p></div><div class="card shoot"><h3>一定要拍</h3>${(s.must||[]).map(x=>`<span class="tag must">${x}</span>`).join('')}</div>${s.maybe?`<div class="card shoot"><h3>有空再拍</h3>${s.maybe.map(x=>`<span class="tag maybe">${x}</span>`).join('')}</div>`:''}${s.skip?`<div class="card shoot"><h3>不用特地拍</h3>${s.skip.map(x=>`<span class="tag skip">${x}</span>`).join('')}</div>`:''}${s.thumb?`<div class="card shoot"><h3>Thumbnail 候選</h3><ul>${s.thumb.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}${listCard('現場辨識／字幕素材',d.identify)}<div class="card"><h3>拍攝規則</h3><p class="muted">先拍真實反應，再補資訊口白。未體驗前不預寫「很好吃／必去」。不要為了補鏡頭讓五人停下來重走、重排隊；禁拍區不拍。</p></div>`}}document.getElementById('travelBtn').onclick=()=>{mode='travel';travelBtn.classList.add('active');shootBtn.classList.remove('active');render()};document.getElementById('shootBtn').onclick=()=>{mode='shoot';shootBtn.classList.add('active');travelBtn.classList.remove('active');render()};render();
</script>
</body>
</html>
