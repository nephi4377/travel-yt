<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>釜山行程地圖指南</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <style>
    :root { --bg: #f7f7f5; --card: #fff; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --go: #1d4ed8; --eat: #c2410c; --ok: #166534; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--ink); }
    header { padding: 16px 16px 8px; }
    h1 { font-size: 1.3rem; margin: 0 0 6px; line-height: 1.3; }
    .sub { color: var(--muted); font-size: 0.95rem; margin: 0; line-height: 1.5; }
    #status { font-size: 0.9rem; color: var(--muted); margin: 8px 0 0; min-height: 1.3em; }
    #status.busy { color: var(--go); }
    .days { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px 12px; -webkit-overflow-scrolling: touch; }
    .days button {
      flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
      padding: 10px 14px; font-size: 0.95rem; min-height: 44px; cursor: pointer;
    }
    .days button.active { background: var(--go); color: #fff; border-color: var(--go); }
    .map-wrap { position: relative; margin: 0 16px; }
    #map { height: 38vh; min-height: 220px; border-radius: 16px; border: 1px solid var(--line); background: #e7e5e4; }
    .map-wait {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 16px; background: rgba(247,247,245,.86); border-radius: 16px;
      font-size: 0.95rem; color: var(--muted); pointer-events: none;
    }
    .map-wait.gone { display: none; }
    .map-wait.err { color: #9a3412; background: rgba(255,247,237,.92); pointer-events: auto; }
    .map-wait button {
      margin-top: 10px; border: 1px solid #fed7aa; background: #fff; color: #c2410c;
      border-radius: 12px; padding: 10px 14px; font-weight: 600; cursor: pointer; min-height: 44px;
    }
    .guide { margin: 12px 16px 32px; }
    .guide h2 { font-size: 1.1rem; margin: 0 0 6px; }
    .lead { color: var(--muted); margin: 0 0 12px; line-height: 1.55; }
    .item {
      width: 100%; display: block; text-align: left; border: 1px solid var(--line); background: var(--card);
      border-radius: 16px; padding: 14px 16px; margin: 0 0 8px; cursor: pointer; min-height: 56px;
    }
    .item.open { border-color: var(--go); box-shadow: 0 0 0 2px #dbeafe; }
    .item .row { display: flex; gap: 10px; align-items: flex-start; }
    .item .time { flex: 0 0 auto; font-weight: 700; color: var(--go); min-width: 3.4em; }
    .item .ttl { font-weight: 700; font-size: 1.02rem; }
    .item .one { color: var(--muted); font-size: 0.92rem; margin-top: 4px; line-height: 1.4; }
    .item .hint { color: var(--go); font-size: 0.85rem; margin-top: 6px; }
    .panel {
      display: none; border: 1px solid var(--line); border-top: none; background: var(--card);
      border-radius: 0 0 16px 16px; padding: 4px 16px 16px; margin: -16px 0 10px; position: relative; z-index: 1;
    }
    .item.open + .panel { display: block; }
    .panel p, .panel li { color: var(--muted); line-height: 1.6; }
    .panel h3 { font-size: 0.95rem; margin: 14px 0 6px; color: var(--ink); }
    .panel ol, .panel ul { margin: 6px 0 8px; padding-left: 1.2rem; }
    .ok { color: var(--ok); font-weight: 600; }
    .warn { background: #fff7ed; border-radius: 12px; padding: 10px 12px; color: #9a3412; }
    .opt {
      border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 8px 0; background: #fffaf5;
    }
    .opt strong { display: block; margin-bottom: 4px; color: var(--eat); }
    .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .acts a, button.say, button.close {
      display: block; text-align: center; text-decoration: none; border-radius: 12px; padding: 12px 14px;
      min-height: 44px; font-weight: 600; font-size: 0.95rem; border: 1px solid var(--line);
    }
    .acts a.place { color: var(--go); background: #eff6ff; border-color: #bfdbfe; }
    .acts a.eat { color: var(--eat); background: #fff7ed; border-color: #fed7aa; }
    button.say {
      border: 1px solid var(--go); background: #eff6ff; color: var(--go); cursor: pointer; width: 100%;
    }
    button.close { width: 100%; background: #f5f5f4; cursor: pointer; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin: 8px 0 12px; }
    th, td { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
    th { background: #f5f5f4; }
    .addr { background: #f5f5f4; border-radius: 12px; padding: 12px 14px; margin: 8px 0; }
    .zh { color: var(--muted); font-weight: 500; }
    .note { font-size: 0.85rem; color: var(--muted); padding: 0 16px 28px; }
    .block { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>釜山行程（點格子看詳情）</h1>
    <p class="sub">2026/9/7–9/12　五人　住 Booking the Bay。先選日期，再點那一格：會展開怎麼走、怎麼吃、韓文聽唸、導航。</p>
    <p id="status">請選上面的日期</p>
  </header>
  <nav class="days" id="days" aria-label="選日期"></nav>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-wait" id="mapWait">地圖載入中…街道圖要一點時間</div>
  </div>
  <section class="guide" id="guide"></section>
  <p class="note">店會公休、會搬家。出發前用地圖看「現在有沒有開」。街道圖來自 OpenStreetMap／備援圖層，餐廳位置可能差幾十公尺，導航請用韓文店名。沒網路時行程文字仍可看，只是地圖可能空白。</p>

  <script src="vendor/leaflet/leaflet.js"></script>

    function sayKo(text) {
      if (!text || !window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR";
      u.rate = 0.85;
      const ko = window.speechSynthesis.getVoices().find(function (v) {
        return (v.lang || "").toLowerCase().indexOf("ko") === 0;
      });
      if (ko) u.voice = ko;
      window.speechSynthesis.speak(u);
    }
    document.addEventListener("click", function (e) {
      const b = e.target.closest("[data-say]");
      if (!b) return;
      e.preventDefault();
      e.stopPropagation();
      sayKo(b.getAttribute("data-say"));
    });
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = function () { window.speechSynthesis.getVoices(); };
    }

    function kakao(p) {
      return "https://map.kakao.com/link/to/" + encodeURIComponent(p.say || p.name) + "," + p.lat + "," + p.lng;
    }
    function gmaps(p) {
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.say || p.name);
    }
    function listenBtn(say, label) {
      if (!say) return "";
      return '<button type="button" class="say" data-say="' + say + '">' + (label || "聽韓文") + "</button>";
    }
    function navBtns(key) {
      const p = P[key];
      if (!p) return "";
      const cls = p.kind === "eat" ? "eat" : "place";
      return '<div class="acts">' +
        listenBtn(p.say, "聽：" + p.name + "（" + p.zh + "）") +
        '<a class="' + cls + '" href="' + kakao(p) + '" target="_blank" rel="noopener">Kakao 導航：' + p.name + "</a>" +
        '<a class="' + cls + '" href="' + gmaps(p) + '" target="_blank" rel="noopener">Google 搜店名</a>' +
        "</div>";
    }
    function optHtml(o) {
      return '<div class="opt"><strong>' + o.title + "</strong><p>" + o.body + "</p>" +
        (o.point ? navBtns(o.point) : (o.say ? '<div class="acts">' + listenBtn(o.say, "聽店名") + "</div>" : "")) +
        "</div>";
    }
    function listHtml(arr, ordered) {
      if (!arr || !arr.length) return "";
      const tag = ordered ? "ol" : "ul";
      return "<" + tag + ">" + arr.map(function (t) { return "<li>" + t + "</li>"; }).join("") + "</" + tag + ">";
    }

    const days = [
      {

        title: "出發前先做這幾件",

      ["草梁豬肉湯飯", "초량돼지국밥", "草-梁 堆-吉 國-巴"],

      ["朴家彥陽烤肉", "박가네언양불고기", "朴-加-內 彥-陽 不-高-基"],
      ["廣安木", "광안목", "廣-安-木"],
      ["고짚", "고짚", "高-集"],
      ["炒雞", "닭갈비", "達-克-加-比"],
      ["五花肉", "삼겹살", "三-格-薩"],
      ["只要肉", "수육만", "數-肉-滿"],
      ["五位", "다섯 명이요", "達-搜 明-唷"]

    function taxiHtml() {
      return '<div class="block">' +
        "<h3>給司機看的地址</h3>" +
        '<div class="addr" lang="ko">충장대로 160 부킹더베이<br><span class="zh">衝-張-對-路 一百六十　布-慶-的-貝</span></div>' +
        '<div class="acts">' +
        listenBtn("충장대로 백육십 부킹더베이", "聽：地址給司機") +
        listenBtn("부킹더베이", "聽：飯店名") +
        '<a class="place" href="' + kakao(P.hotel) + '" target="_blank" rel="noopener">導航飯店（Kakao）</a>' +
        '<a class="place" href="' + kakao(P.airport) + '" target="_blank" rel="noopener">導航金海機場（Kakao）</a>' +
        "</div>" +
        "<h3>金海機場怎麼叫車</h3>" +
        "<ol>" +
        "<li>領完行李，跟指標走택시（計程車）到<strong>官方排隊處</strong>。" + listenBtn("택시", "聽：計程車") + "</li>" +
        "<li>看牌子：일반（一般，約 4 人）、모범（模範）、대형（大型）。五人加行李先排大型一台。" +
        listenBtn("대형", "聽：大型") + "</li>" +
        "<li>上車確認螢幕在跳數字。把上面地址給司機看。</li>" +
        "<li>沒有大型：兩台一般車，約在飯店門口會合。</li>" +
        "<li>有網路也可用 Kakao T 看預估金額。機場現場排隊通常比較快。</li>" +
        "</ol>" +
        "<p>回程：飯店櫃檯叫車，或 Kakao T，目的地金海機場國際線。</p>" +
        "<h3>大概多少錢（白天、跳表）</h3>" +
        "<p>金海官網概估：一台去南浦約 2 萬、西面約 1.8 萬。你們飯店在釜山站旁，一台一般車大約 1.8–2.5 萬韓元（約 400–600 台幣）。1 萬韓元約 230 台幣。</p>" +
        "<table><thead><tr><th>路段</th><th>一台一般</th><th>五人兩台</th><th>一台大型</th></tr></thead><tbody>" +
        "<tr><td>金海 ↔ 飯店</td><td>1.8–2.5 萬</td><td>約 3.6–5 萬</td><td>約 3.2–4.5 萬</td></tr>" +
        "<tr><td>接機＋送機</td><td>—</td><td>約 7–10 萬</td><td>約 6.5–9 萬</td></tr>" +
        "<tr><td>飯店 → 太宗台</td><td>1.5–2.2 萬</td><td>約 3–4.4 萬</td><td>視車況</td></tr>" +
        "<tr><td>太宗台 → 澡堂</td><td>1.8–2.5 萬</td><td>約 3.6–5 萬</td><td>視車況</td></tr>" +
        "</tbody></table>" +
        "<p>9/7 約 21 點到，還沒到深夜加成（通常 23 點後）。看跳表，不要一口價。</p>" +
        "<h3>跟包車比</h3>" +
        "<table><thead><tr><th>項目</th><th>包車起</th><th>計程車五人</th><th>建議</th></tr></thead><tbody>" +
        "<tr><td>接機／送機各 9 座</td><td>各 10 萬</td><td>兩台約 3.6–5 萬或大型一台</td><td>坐計程車</td></tr>" +
        "<tr><td>釜山包車 11 座 9 小時</td><td>32 萬</td><td>10 日叫車約 7–10 萬；市區地鐵</td><td>不必訂</td></tr>" +
        "<tr><td>郊區包車</td><td>38 萬</td><td>這趟沒排郊區</td><td>不要訂</td></tr>" +
        "</tbody></table>" +
        "<p>點餐：湯飯先喝再加鹽，韭菜放進去。不要內臟就說 수육만。" + listenBtn("수육만", "聽：只要肉") +
        "烤肉五人先點 3～4 人份再追加。</p></div>";
    }

    function speakHtml() {
      let rows = "";
      PHRASES.forEach(function (row) {
        rows += "<tr><td>" + row[0] + "</td><td>" + row[1] + "</td><td>" + row[2] + "</td><td>" +
          listenBtn(row[1], "聽") + "</td></tr>";
      });
      return '<div class="block"><div style="overflow-x:auto"><table><thead><tr><th>中文</th><th>韓文</th><th>近似音</th><th></th></tr></thead><tbody>' +
        rows + "</tbody></table></div><p>訂位句：</p><div class=\"acts\">" +
        listenBtn("다섯 명이요. 오늘 저녁 일곱 시요.", "聽：五位，今晚七點") +
        "</div><p class=\"zh\">達-搜-明-唷。歐-嫩 著-娘 一-勾-時-唷。</p></div>";
    }

    const mapWait = document.getElementById("mapWait");
    const hasLeaflet = !!window.L;
    let map = null;
    let layer = null;
    let orangeIcon = null;
    let defaultIcon = null;
    let tileOk = false;
    let tileFailTimer = null;

    function showMapErr(msg) {
      mapWait.className = "map-wait err";
      mapWait.innerHTML = msg + '<br><button type="button" id="mapRetry">再試一次地圖</button>';
      const btn = document.getElementById("mapRetry");
      if (btn) btn.onclick = function () { location.reload(); };
    }

    function hideMapWait() {
      mapWait.className = "map-wait gone";
      mapWait.textContent = "";
    }

    function attachTiles(mapObj) {
      const sources = [
        {
          url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
          opts: { subdomains: "abcd", attribution: "&copy; OpenStreetMap &copy; CARTO", maxZoom: 20 }
        },
        {
          url: "https://tile.openstreetmap.de/{z}/{x}/{y}.png",
          opts: { attribution: "&copy; OpenStreetMap", maxZoom: 19 }
        },
        {
          url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          opts: { attribution: "&copy; OpenStreetMap", maxZoom: 19 }
        }
      ];
      let idx = 0;
      let current = null;
      let errors = 0;

      function useSource(i) {
        if (current) mapObj.removeLayer(current);
        idx = i;
        errors = 0;
        const src = sources[i];
        current = L.tileLayer(src.url, src.opts).addTo(mapObj);
        current.on("load", function () {
          tileOk = true;
          hideMapWait();
          if (tileFailTimer) clearTimeout(tileFailTimer);
        });
        current.on("tileerror", function () {
          errors += 1;
          if (tileOk) return;
          if (errors >= 3 && idx + 1 < sources.length) {
            useSource(idx + 1);
          }
        });
      }

      useSource(0);
      tileFailTimer = setTimeout(function () {
        if (tileOk) return;
        if (idx + 1 < sources.length) {
          useSource(idx + 1);
          tileFailTimer = setTimeout(function () {
            if (!tileOk) {
              showMapErr("街道圖連不上（可能沒網路或圖磚被擋）。下面行程文字仍可看、可點開。");
            }
          }, 6000);
        } else {
          showMapErr("街道圖連不上（可能沒網路或圖磚被擋）。下面行程文字仍可看、可點開。");
        }
      }, 5000);
    }

    if (!hasLeaflet) {
      showMapErr("地圖程式載不進來。請檢查網路後重新整理；下面行程文字仍可看。");
    } else {
      L.Icon.Default.mergeOptions({
        iconUrl: "vendor/leaflet/images/marker-icon.png",
        iconRetinaUrl: "vendor/leaflet/images/marker-icon-2x.png",
        shadowUrl: "vendor/leaflet/images/marker-shadow.png"
      });
      map = L.map("map");
      attachTiles(map);
      orangeIcon = new L.DivIcon({
        className: "",
        html: '<div style="width:18px;height:18px;background:#c2410c;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.35)"></div>',
        iconSize: [18, 18], iconAnchor: [9, 9]
      });
      defaultIcon = new L.Icon.Default();
      layer = L.layerGroup().addTo(map);
    }

    const nav = document.getElementById("days");
    const guideEl = document.getElementById("guide");
    const statusEl = document.getElementById("status");
    let current = days[1];
    let openId = null;

    function itemHtml(it) {
      const open = it.id === openId;
      let body = "";
      if (it.steps) body += listHtml(it.steps, true);
      if (it.options) {
        body += "<h3>選一項就好</h3>" + it.options.map(optHtml).join("");
      }
      if (it.extra) body += it.extra;
      if (it.point && !it.options) body += navBtns(it.point);
      if (it.ok) body += '<p class="ok">成功：' + it.ok + "</p>";
      return '<button type="button" class="item' + (open ? " open" : "") + '" data-item="' + it.id + '" aria-expanded="' + open + '">' +
        '<div class="row"><span class="time">' + it.time + "</span><div>" +
        '<div class="ttl">' + it.title + "</div>" +
        (it.one ? '<div class="one">' + it.one + "</div>" : "") +
        '<div class="hint">' + (open ? "點這裡收合" : "點開看完整說明") + "</div>" +
        "</div></div></button>" +
        '<div class="panel" id="p-' + it.id + '">' + body +
        '<button type="button" class="close" data-item="' + it.id + '">收合</button></div>';
    }

    function drawMap(day, focusKey) {
      if (!map || !layer) return;
      layer.clearLayers();
      const latlngs = [];
      (day.points || []).forEach(function (key) {
        const p = P[key];
        if (!p) return;
        latlngs.push([p.lat, p.lng]);
        const mark = L.marker([p.lat, p.lng], {
          icon: p.kind === "eat" ? orangeIcon : defaultIcon
        }).addTo(layer);
        mark.bindPopup("<b>" + p.name + "</b>");
        mark.on("click", function () {
          const hit = (day.items || []).find(function (it) {
            if (it.point === key) return true;
            return (it.options || []).some(function (o) { return o.point === key; });
          });
          if (hit) {
            openId = hit.id;
            render(day, false);
            const el = document.querySelector('[data-item="' + hit.id + '"]');
            if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });
      });
      (day.lines || []).forEach(function (pair) {
        L.polyline([[P[pair[0]].lat, P[pair[0]].lng], [P[pair[1]].lat, P[pair[1]].lng]], {
          color: "#1d4ed8", weight: 4, opacity: 0.65
        }).addTo(layer);
      });
      if (focusKey && P[focusKey]) {
        map.setView([P[focusKey].lat, P[focusKey].lng], 15);
      } else if (latlngs.length) {
        map.fitBounds(L.latLngBounds(latlngs).pad(0.22));
      }
    }

    function render(day, fit) {
      current = day;
      document.querySelectorAll(".days button").forEach(function (b) {
        b.classList.toggle("active", b.dataset.id === day.id);
      });
      statusEl.classList.remove("busy");
      statusEl.textContent = "現在看：" + day.title + "。點下面一格會展開。";

      let inner = "<h2>" + day.title + "</h2><p class=\"lead\">" + (day.lead || "") + "</p>";
      if (day.custom === "taxi") inner += taxiHtml();
      else if (day.custom === "speak") inner += speakHtml();
      else inner += (day.items || []).map(itemHtml).join("");
      guideEl.innerHTML = inner;

      const focus = openId && (day.items || []).find(function (it) { return it.id === openId; });
      drawMap(day, (fit === false && focus && focus.point) ? focus.point : null);
    }

    guideEl.addEventListener("click", function (e) {
      const btn = e.target.closest("[data-item]");
      if (!btn) return;
      const id = btn.getAttribute("data-item");
      openId = openId === id ? null : id;
      const it = (current.items || []).find(function (x) { return x.id === id; });
      render(current, false);
      if (map && openId && it && it.point) {
        map.setView([P[it.point].lat, P[it.point].lng], 15);
      }
      const el = document.querySelector('[data-item="' + id + '"]');
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    days.forEach(function (day, i) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = day.label;
      b.dataset.id = day.id;
      b.addEventListener("click", function () {
        openId = null;
        statusEl.classList.add("busy");
        statusEl.textContent = "正在換成「" + day.label + "」…";
        render(day, true);
      });
      nav.appendChild(b);
      if (day.id === "d7") render(day, true);
    });
  </script>
