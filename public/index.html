<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>豪哥旅遊手冊</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--accent:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:760px;margin:auto;padding:28px 18px 52px}.eyebrow{font-size:.78rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
h1{font-size:2rem;line-height:1.15;margin:8px 0 10px}.lead{color:var(--muted);line-height:1.7;margin:0 0 24px}
.grid{display:grid;gap:14px}.trip{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.04)}
.trip:active{transform:scale(.995)}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.date{font-size:.78rem;color:var(--muted);font-weight:700}.trip h2{margin:6px 0 6px;font-size:1.35rem}.trip p{margin:0;color:var(--muted);line-height:1.55;font-size:.94rem}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.badge{font-size:.78rem;border-radius:999px;padding:6px 9px;background:#f4f4f5;color:#52525b}
.arrow{font-size:1.4rem;line-height:1;color:#a1a1aa}.future{opacity:.78}.foot{margin-top:24px;color:var(--muted);font-size:.82rem;line-height:1.6}
</style>
</head>
<body><main class="wrap">
<div class="eyebrow">TRAVEL LOG</div>
<h1>我的旅程</h1>
<p class="lead">每趟旅行各自一頁。手機打開首頁，選目的地就進入當次行程、地圖、餐飲與現場備案。</p>
<section class="grid">
<a class="trip" href="./hanoi/"><div class="top"><div><div class="date">2026/10/05–10/10</div><h2>🇻🇳 河內</h2></div><div class="arrow">›</div></div><p>老城慢走、建築觀察、在地名物。行程規劃中，先放推薦骨架。</p><div class="badges"><span class="badge">行程</span><span class="badge">景點</span><span class="badge">餐飲</span><span class="badge">附近備案</span></div></a>
<a class="trip" href="./busan/"><div class="top"><div><div class="date">2026/09/07–09/12</div><h2>🇰🇷 釜山</h2></div><div class="arrow">›</div></div><p>已完成。保留原本的每日行程、地圖、餐飲、交通與韓文朗讀。</p><div class="badges"><span class="badge">已完成</span><span class="badge">地圖</span><span class="badge">導航</span></div></a>
<a class="trip future" href="./shanghai/"><div class="top"><div><div class="date">2026/11/23–11/29</div><h2>🇨🇳 上海</h2></div><div class="arrow">›</div></div><p>跟團行程。先建立分頁，之後補自由時間、餐飲與可自行走的路線。</p><div class="badges"><span class="badge">待規劃</span></div></a>
</section>
<p class="foot">設計原則：首頁只選旅程；進入旅程後再看每天行程，不把所有資訊塞在同一頁。</p>
</main></body></html>
