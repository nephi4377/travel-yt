<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>河內 2026｜旅遊手冊</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#191919;--muted:#6b6b6b;--line:#e7e2d8;--red:#9f2d20;--green:#315c43;--blue:#1f4f7a;--amber:#8a6320}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:820px;margin:auto;padding:16px 14px 54px}.back{display:inline-block;text-decoration:none;color:#444;margin:2px 0 12px}
.hero{padding:6px 0 12px}.hero h1{margin:2px 0 8px;font-size:1.8rem}.sub,.card p{color:var(--muted);line-height:1.6}.daymeta{font-size:.8rem;color:#777;font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;position:sticky;top:0;background:rgba(247,245,240,.96);z-index:900}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 14px;font-weight:700;min-height:44px}.tabs button.active{background:#1f2937;color:#fff}
.notice{padding:12px 14px;border-radius:14px;background:#fff8e8;color:#765f23;line-height:1.55;margin:0 0 12px}
#map{height:360px;border:1px solid var(--line);border-radius:18px;background:#e8e6df;margin-bottom:12px}
.maphelp{font-size:.82rem;color:var(--muted);line-height:1.5;margin:0 2px 14px}
.daypanel{display:none}.daypanel.active{display:block}
.route{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.route span{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:.82rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:flex-start}.num{width:29px;height:29px;border-radius:50%;background:#1f2937;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 29px}.grow{min-width:0;flex:1}
.card h3{margin:1px 0 5px;font-size:1.05rem}.why{font-size:.9rem;color:var(--muted);line-height:1.55}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{font-size:.74rem;padding:5px 8px;border-radius:999px;background:#f1f1ef}.mine{background:#e7efe9;color:var(--green)}.web{background:#f8e9e5;color:var(--red)}.food{background:#fff0db;color:#7a4b10}.opt{background:#e9f0f7;color:var(--blue)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.actions button,.actions a{border:1px solid var(--line);background:#f7f7f6;color:#252525;text-decoration:none;border-radius:11px;padding:9px 11px;font-weight:700;font-size:.85rem;min-height:42px}
.actions button{cursor:pointer}.actions .focus{background:#eef3f8;color:#193b59}
.sectiontitle{font-size:1.08rem;margin:16px 2px 8px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.8rem;color:var(--muted);margin:8px 0 12px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}.d-place{background:#2563eb}.d-food{background:#c2410c}.d-base{background:#166534}
.small{font-size:.82rem;color:var(--muted)}
@media(max-width:480px){#map{height:320px}.wrap{padding-left:12px;padding-right:12px}}
</style>
</head>
<body><main class="wrap">
<a class="back" href="../">← 所有旅程</a>
<section class="hero"><div class="daymeta">2026/10/05–10/10 · 4 位成人</div><h1>🇻🇳 河內</h1><p class="sub">豪哥、太太、郭同學、洪同學。10/6 三人先行；10/7–9 四人正式主行程；10/10 回程。</p></section>

<div class="notice">地圖直接內嵌在頁面。點下面日期會只顯示當天站點與概略路線；點「地圖聚焦」可把地圖拉到那一站。座標用於旅程概覽，導航仍以店名／地址開 Google Maps 為準。</div>

<nav class="tabs" id="tabs"></nav>
<div id="map"></div>
<p class="maphelp">藍色＝景點、橘色＝餐飲、綠色＝住宿／機場。線段是「大概怎麼走」的概略順序，不代表即時道路導航。</p>
<section id="content"></section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const P={
 airport:{n:"內排國際機場",lat:21.2187,lng:105.8042,k:"base",q:"Noi Bai International Airport Hanoi"},
 westlake:{n:"西湖／住宿區",lat:21.0588,lng:105.8185,k:"base",q:"West Lake Hanoi"},
 hoankiem:{n:"還劍湖",lat:21.0285,lng:105.8521,k:"place",q:"Hoan Kiem Lake Hanoi"},
 cathedral:{n:"聖若瑟主教座堂",lat:21.0288,lng:105.8488,k:"place",q:"St Joseph Cathedral Hanoi"},
 oldquarter:{n:"河內老城／36古街",lat:21.0340,lng:105.8500,k:"place",q:"Hanoi Old Quarter"},
 dongxuan:{n:"同春市場",lat:21.0383,lng:105.8490,k:"place",q:"Dong Xuan Market Hanoi"},
 longbien:{n:"龍邊橋",lat:21.0438,lng:105.8585,k:"place",q:"Long Bien Bridge Hanoi"},
 temple:{n:"文廟－國子監",lat:21.0277,lng:105.8355,k:"place",q:"Temple of Literature Hanoi"},
 french:{n:"法國區／河內歌劇院一帶",lat:21.0243,lng:105.8575,k:"place",q:"Hanoi Opera House"},
 train:{n:"火車街",lat:21.0298,lng:105.8412,k:"place",q:"Hanoi Train Street"},
 giang:{n:"Café Giảng",lat:21.0320,lng:105.8546,k:"food",q:"Cafe Giang 39 Nguyen Huu Huan Hanoi"},
 xoiyen:{n:"Xôi Yến",lat:21.0328,lng:105.8545,k:"food",q:"Xoi Yen 35B Nguyen Huu Huan Hanoi"},
 huonglien:{n:"Bún Chả Hương Liên",lat:21.0180,lng:105.8564,k:"food",q:"Bun Cha Huong Lien 24 Le Van Huu Hanoi"},
 chacathanglong:{n:"Chả Cá Thăng Long",lat:21.0330,lng:105.8454,k:"food",q:"Cha Ca Thang Long 6B Duong Thanh Hanoi"},
 pho:{n:"河粉（當區找）",lat:21.0325,lng:105.8498,k:"food",q:"pho Hanoi Old Quarter"},
 banhmi:{n:"Bánh mì（當區找）",lat:21.0307,lng:105.8500,k:"food",q:"banh mi Hanoi Old Quarter"}
};
const days=[
{id:"d5",lab:"10/5 飛機",title:"10/5｜搭機與入住",route:["airport","westlake"],items:[
 {p:"airport",t:"20:35 內排機場",d:"VJ947 抵達。入境、領行李後直接往西湖住宿。",tags:["交通"]},
 {p:"westlake",t:"西湖住宿區",d:"只進房、附近吃熱食、睡覺；不加景點。",tags:["住宿"]}
]},
{id:"d6",lab:"10/6 3人",title:"10/6｜三人先行・輕量暖身",route:["westlake","cathedral","giang","westlake"],items:[
 {p:"westlake",t:"西湖慢走／早餐",d:"三人先行日，不先把四人核心路線走完；先熟悉住宿周邊。",tags:["符合豪哥"]},
 {p:"cathedral",t:"聖若瑟主教座堂周邊",d:"適合三人先行的短線：建築外觀＋周邊街屋，不需要長時間停留。",tags:["網紅常推","建築"]},
 {p:"giang",t:"Café Giảng 蛋咖啡",d:"代表性體驗一次即可。39 Nguyễn Hữu Huân；不把咖啡巡店當主題。",tags:["網紅常推","加菜"]},
 {p:"westlake",t:"回西湖吃晚餐",d:"附近找 phở／bánh mì／bún chả，不為名店再跨區。",tags:["符合豪哥","在地名物"]}
]},
{id:"d7",lab:"10/7 正式1",title:"10/7｜四人正式 Day 1・老城核心",route:["hoankiem","oldquarter","dongxuan","giang","chacathanglong"],items:[
 {p:"hoankiem",t:"還劍湖",d:"四人一起用它認河內中心方向；不用當成長時間景點。",tags:["網紅常推","我私心推"]},
 {p:"oldquarter",t:"36 古街／老城慢走",d:"主角不是打卡，是街屋、tube house、店面尺度、進貨、人流與機車。",tags:["我私心推","符合豪哥"]},
 {p:"dongxuan",t:"同春市場",d:"看當地商業與物流。市場是看城市怎麼運作，不是伴手禮比價。",tags:["我私心推","符合豪哥"]},
 {p:"giang",t:"Café Giảng（若 10/6 沒喝）",d:"若先行三人已喝過，四人日可跳過，不強迫重複。",tags:["可選"]},
 {p:"chacathanglong",t:"Chả Cá Thăng Long",d:"河內特色魚料理。以 6B Đường Thành 這家為優先核對點。",tags:["我私心推","在地名物"]}
]},
{id:"d8",lab:"10/8 正式2",title:"10/8｜四人正式 Day 2・橋、建築、法國區",route:["longbien","temple","french","huonglien"],items:[
 {p:"longbien",t:"龍邊橋",d:"老橋、鐵道、機車流、紅河與城市邊緣；很符合你看城市構造的方式。",tags:["我私心推","符合豪哥"]},
 {p:"temple",t:"文廟－國子監",d:"院落、軸線、屋頂比例與景觀層次值得看；目前資料顯示每日約 08:00–17:00。",tags:["網紅常推","建築"]},
 {p:"french",t:"法國區／歌劇院一帶",d:"用街廓、行道樹、殖民建築跟老城做對比，不做廣場打卡作業。",tags:["我私心推","符合豪哥"]},
 {p:"huonglien",t:"Bún Chả Hương Liên",d:"24 Lê Văn Hưu。名氣很大但菜本身就是河內代表；若排隊久就找附近同類。",tags:["網紅常推","在地名物"]}
]},
{id:"d9",lab:"10/9 正式3",title:"10/9｜四人正式 Day 3・補味道、彈性收尾",route:["pho","banhmi","train","xoiyen","westlake"],items:[
 {p:"pho",t:"Phở 河粉",d:"缺河粉就補河粉；早餐優先，不需要為某一家排長隊。",tags:["必吃","符合豪哥"]},
 {p:"banhmi",t:"Bánh mì",d:"法國麵包夾肉與醃菜，當正餐或點心都可。",tags:["必吃"]},
 {p:"train",t:"火車街（可選）",d:"有獨特性但觀光化高。只在順路、管制允許時去，不為等火車綁死半天。",tags:["網紅常推","可選"]},
 {p:"xoiyen",t:"Xôi Yến",d:"35B Nguyễn Hữu Huân。糯米飯很生活化，可當順路加餐，不需專程。",tags:["我私心推","在地"]},
 {p:"westlake",t:"回西湖早收",d:"晚上回住宿區、整理行李；10/10 不再塞景點。",tags:["收尾"]}
]},
{id:"d10",lab:"10/10 回程",title:"10/10｜回程",route:["westlake","airport"],items:[
 {p:"westlake",t:"10:30–11:00 前離開住宿",d:"回程 VJ946 既有資料約 14:35 起飛，最終仍以機票為準。",tags:["交通"]},
 {p:"airport",t:"內排國際機場",d:"國際線預留時間，不排早市、不繞舊城。",tags:["回程"]}
]}
];
function gmap(p){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.q||p.n)}
function tagClass(x){if(x.includes("網紅"))return"web";if(x.includes("名物")||x.includes("必吃")||x.includes("在地"))return"food";if(x.includes("可選"))return"opt";return"mine"}
const map=L.map("map",{zoomControl:true});
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"&copy; OpenStreetMap"}).addTo(map);
let layer=L.layerGroup().addTo(map);
const icons={
 place:L.divIcon({className:"",html:'<div style="width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 1px 5px #555"></div>',iconSize:[18,18],iconAnchor:[9,9]}),
 food:L.divIcon({className:"",html:'<div style="width:18px;height:18px;border-radius:50%;background:#c2410c;border:3px solid #fff;box-shadow:0 1px 5px #555"></div>',iconSize:[18,18],iconAnchor:[9,9]}),
 base:L.divIcon({className:"",html:'<div style="width:18px;height:18px;border-radius:50%;background:#166534;border:3px solid #fff;box-shadow:0 1px 5px #555"></div>',iconSize:[18,18],iconAnchor:[9,9]})
};
const tabs=document.getElementById("tabs"),content=document.getElementById("content");
let current="d6";
function draw(day,focus){
 layer.clearLayers(); const pts=[];
 day.route.forEach((key,i)=>{const p=P[key]; if(!p)return; pts.push([p.lat,p.lng]); const m=L.marker([p.lat,p.lng],{icon:icons[p.k]}).addTo(layer);m.bindPopup("<b>"+(i+1)+". "+p.n+"</b>")});
 if(pts.length>1)L.polyline(pts,{color:"#475569",weight:4,opacity:.65,dashArray:"8 7"}).addTo(layer);
 if(focus&&P[focus]) map.setView([P[focus].lat,P[focus].lng],15);
 else if(pts.length) map.fitBounds(L.latLngBounds(pts).pad(.22));
 setTimeout(()=>map.invalidateSize(),80);
}
function render(id){
 current=id; const d=days.find(x=>x.id===id);
 [...tabs.children].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
 content.innerHTML='<h2 class="sectiontitle">'+d.title+'</h2><div class="route">'+d.route.map((k,i)=>'<span>'+(i+1)+'. '+P[k].n+'</span>').join("")+'</div>'+
 d.items.map((it,i)=>{const p=P[it.p];return '<article class="card"><div class="row"><div class="num">'+(i+1)+'</div><div class="grow"><h3>'+it.t+'</h3><div class="why">'+it.d+'</div><div class="tags">'+it.tags.map(t=>'<span class="tag '+tagClass(t)+'">'+t+'</span>').join("")+'</div><div class="actions"><button type="button" class="focus" data-focus="'+it.p+'">地圖聚焦</button><a href="'+gmap(p)+'" target="_blank" rel="noopener">Google 導航</a></div></div></div></article>'}).join("");
 draw(d);
}
days.forEach(d=>{const b=document.createElement("button");b.type="button";b.textContent=d.lab;b.dataset.id=d.id;b.addEventListener("click",()=>render(d.id));tabs.appendChild(b)});
content.addEventListener("click",e=>{const b=e.target.closest("[data-focus]");if(!b)return;draw(days.find(x=>x.id===current),b.dataset.focus);document.getElementById("map").scrollIntoView({behavior:"smooth",block:"center"})});
render(current);
</script>
</body></html>
